<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VoiceSphere – Connecting...</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #080a10;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .logo {
      width: 80px;
      height: 80px;
      margin-bottom: 24px;
      animation: pulse 2s infinite ease-in-out;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #38bdf8 0%, #818cf8 50%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: #94a3b8;
      font-size: 14px;
      max-width: 320px;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 24px;
      background: linear-gradient(135deg, #d97706, #f59e0b);
      color: #000;
      font-weight: 700;
      border-radius: 9999px;
      text-decoration: none;
      font-size: 14px;
      border: none;
      cursor: pointer;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.08); opacity: 0.85; }
    }
  </style>
  <script>
    // Global SpeechSynthesis and SpeechRecognition polyfill for Android WebView
    (function() {
      try {
        if (!window.speechSynthesis) {
          window.speechSynthesis = {
            speaking: false, paused: false, pending: false, onvoiceschanged: null,
            getVoices: function() { return []; },
            speak: function(u) { if (u && u.onend) setTimeout(u.onend, 50); },
            cancel: function() {}, pause: function() {}, resume: function() {}
          };
        } else if (typeof window.speechSynthesis.getVoices !== 'function') {
          window.speechSynthesis.getVoices = function() { return []; };
        }
        if (!window.SpeechRecognition && !window.webkitSpeechRecognition) {
          var DummyRec = function() {
            this.continuous = false; this.interimResults = false; this.lang = 'en-US';
            this.onstart = null; this.onend = null; this.onerror = null; this.onresult = null;
            this.start = function() {}; this.stop = function() {}; this.abort = function() {};
          };
          window.SpeechRecognition = DummyRec;
          window.webkitSpeechRecognition = DummyRec;
        }
      } catch(e) {}
    })();
    window.location.href = "https://voicesphere.pages.dev";
  </script>
</head>
<body>
  <svg class="logo" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
    <circle cx="24" cy="24" r="22" stroke="#818cf8" stroke-width="3" stroke-dasharray="4 4"/>
    <circle cx="24" cy="24" r="14" fill="#6366f1"/>
    <path d="M24 16v16M19 20v8M29 20v8" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  </svg>
  <h1>VoiceSphere</h1>
  <p>Connecting to Global Edge Spatial Audio Network...</p>
  <button class="btn" onclick="window.location.href='https://voicesphere.pages.dev'">Retry Connection</button>
</body>
</html>
